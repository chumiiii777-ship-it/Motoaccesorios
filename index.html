<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motos MIJ">
<title>Inventario Motoaccesorios MIJ</title>
<style>
:root{--bg:#f3f3f5;--card:#fff;--tx:#1b1b20;--mut:#6a6a75;--ac:#c0392b;--ln:#dcdce2;--bad:#fbe6e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1e;--card:#27272b;--tx:#f0f0f3;--mut:#9b9ba6;--ln:#3a3a41;--bad:#4a2327;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1e;--card:#27272b;--tx:#f0f0f3;--mut:#9b9ba6;--ln:#3a3a41;--bad:#4a2327;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{padding:14px 16px 10px;font-weight:700;font-size:19px;border-bottom:6px solid transparent;border-image:repeating-linear-gradient(90deg,var(--tx) 0 10px,var(--bg) 10px 20px) 1}
header small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
main{padding:12px 14px;max-width:720px;margin:0 auto}
h3{margin:14px 0 8px;font-size:17px}
input,select,textarea,button{font:inherit;color:var(--tx);width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut)}
label input,label select{margin-top:3px;color:var(--tx)}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx);margin-bottom:8px}
.chk input{width:22px;height:22px;margin:0}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
button.dng{background:#7a1f18}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.row{display:flex;gap:8px;align-items:center}.row select{flex:1}.row .chk{flex:1;white-space:nowrap}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kpi div{background:var(--card);border-radius:10px;padding:8px 6px;font-size:11px;color:var(--mut);text-align:center}
.kpi b{display:block;font-size:16px;color:var(--tx)}
.kpi .bad b{color:var(--ac)}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:5px solid transparent}
.card.low{border-left-color:var(--ac);background:var(--bad)}
.r1{display:flex;justify-content:space-between;gap:8px}
.stk{font-weight:700;font-size:18px}
.sub{font-size:13px;color:var(--mut)}
.vl{max-height:38vh;overflow:auto}
.it{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}
.it span{flex:1}.it button{width:38px;padding:6px;margin:0}
.tot{text-align:right;font-size:15px}.tot b{font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.in{color:#2e9e57}.out{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{background:none;color:var(--mut);border:0;border-radius:0;margin:0;padding:9px 0;font-size:12px}
nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;z-index:4;box-shadow:0 3px 10px #0005}
#sheet{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.box{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.inv,.inv *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv{background:#fff;color:#000;border-radius:10px;padding:14px;font-size:13px}
.inv h2{margin:0;font-size:20px}.ih{display:flex;justify-content:space-between;gap:10px}.rt{text-align:right}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}
.inv th{background:#c0392b;color:#fff;text-align:left;padding:5px}.inv td{padding:5px;border-bottom:1px solid #eee}
.inv .r{text-align:right}.inv .sm{font-size:10px;color:#666}
@page{margin:12mm}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;display:block;background:none}.box{background:#fff;max-height:none;padding:0}.noprint{display:none}}
</style>
</head>
<body>
<header>Motoaccesorios MIJ<small>Inventario y ventas</small></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
const KEY='mij_inv_v1',CATS=['Cascos','Intercomunicadores','Calcomanías','Otros'];
const SEED=[["Casco integral MT Thunder","Cascos","MT","M","Negro mate","A1",7,2,280000,420000],["Casco integral MT Thunder","Cascos","MT","L","Negro mate","A1",6,2,280000,420000],["Casco abatible LS2 Valiant","Cascos","LS2","L","Gris","A2",3,2,520000,760000],["Casco cross Fox V1","Cascos","Fox","M","Rojo","A3",3,2,310000,450000],["Casco certificado Hawk","Cascos","Hawk","S","Blanco","A4",1,2,150000,230000],["Intercomunicador BT Interphone","Intercomunicadores","Cardo","","Negro","B1",4,2,380000,550000],["Intercomunicador FreedConn T-COM","Intercomunicadores","FreedConn","","Negro","B1",2,2,210000,320000],["Calcomanía reflectiva rueda 17","Calcomanías","Genérica","","Rojo","C1",26,10,6000,15000],["Calcomanía tanque Pulsar","Calcomanías","Genérica","","Azul","C1",11,5,18000,38000],["Guantes de moto","Otros","Alpinestars","M","Negro","D1",9,3,65000,110000],["Candado de disco","Otros","Kovix","","Amarillo","D2",5,2,45000,85000],["Cubierta impermeable para moto","Otros","Genérica","","Gris","D3",4,2,38000,70000]];
const blank=()=>({p:[],m:[],v:[],c:{nombre:'Motoaccesorios MIJ',nit:'',dir:'',tel:'',pre:'MIJ',iva:0},n:{p:1,v:1}});
let S=blank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}};
const $=s=>document.querySelector(s);
const money=n=>'$'+Math.round(n).toLocaleString('es-CO');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const nm=p=>p.nombre+(p.talla?' '+p.talla:'');
let T='inv',q='',cat='',low=false,qv='',cart=[],hv='mov',cl={n:'',d:'',t:'',iva:false};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function sheet(h){$('#sheet').innerHTML='<div class="box">'+h+'</div>';$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
function ask(msg,js){sheet(`<p>${msg}</p><div class="grid2"><button class="dng" onclick="closeSheet();${js}">Sí</button><button class="ghost" onclick="closeSheet()">No</button></div>`)}
function log(p,t,c,mo){S.m.unshift({f:now(),pid:p.id,n:nm(p),t,c,mo})}
function go(t){T=t;render()}
function render(){
 $('#nav').innerHTML=[['inv','📦','Inventario'],['venta','🛒','Venta'],['hist','🕘','Historial'],['mas','⚙️','Más']].map(a=>`<button class="${T===a[0]?'on':''}" onclick="go('${a[0]}')"><i>${a[1]}</i>${a[2]}</button>`).join('');
 $('#main').innerHTML={inv,venta,hist,mas}[T]();
}
/* Inventario */
function inv(){
 const lowN=S.p.filter(p=>p.stock<=p.minimo).length;
 return `<div class="kpi"><div><b>${S.p.length}</b>Referencias</div><div><b>${S.p.reduce((a,p)=>a+p.stock,0)}</b>Unidades</div><div><b>${money(S.p.reduce((a,p)=>a+p.stock*p.costo,0))}</b>Valor costo</div><div class="${lowN?'bad':''}"><b>${lowN}</b>Stock bajo</div></div>
 <input placeholder="Buscar por nombre, marca o color…" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=invList()">
 <div class="row"><select onchange="cat=this.value;$('#list').innerHTML=invList()"><option value="">Todas las categorías</option>${CATS.map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select><label class="chk"><input type="checkbox" ${low?'checked':''} onchange="low=this.checked;$('#list').innerHTML=invList()">Solo stock bajo</label></div>
 <div id="list">${invList()}</div><button class="fab" onclick="formProd()">＋</button>`}
function invList(){
 if(!S.p.length)return `<div class="card"><b>Aún no hay productos</b><p class="sub">Toca ＋ para crear el primero o carga los datos de prueba.</p><button onclick="loadSeed()">Cargar datos de prueba</button></div>`;
 const k=q.toLowerCase();
 const l=S.p.filter(p=>(!k||(p.nombre+' '+p.marca+' '+p.color).toLowerCase().includes(k))&&(!cat||p.categoria===cat)&&(!low||p.stock<=p.minimo));
 if(!l.length)return '<p class="sub">Ningún producto coincide con la búsqueda.</p>';
 return l.map(p=>`<div class="card ${p.stock<=p.minimo?'low':''}" onclick="prod(${p.id})"><div class="r1"><b>${esc(nm(p))}</b><span class="stk">${p.stock}</span></div><div class="sub">${esc(p.categoria)}, ${esc(p.marca)||'sin marca'}${p.color?', '+esc(p.color):''}${p.ubicacion?', ubicación '+esc(p.ubicacion):''}</div><div class="sub">Venta ${money(p.venta)}, mínimo ${p.minimo}</div></div>`).join('')}
function loadSeed(){
 S.p=SEED.map((a,i)=>({id:i+1,nombre:a[0],categoria:a[1],marca:a[2],talla:a[3],color:a[4],ubicacion:a[5],stock:a[6],minimo:a[7],costo:a[8],venta:a[9]}));
 S.n.p=SEED.length+1;S.m=[];S.v=[];S.n.v=1;save();render();toast('Datos de prueba cargados')}
function prod(id){const p=S.p.find(x=>x.id===id);if(!p)return;
 sheet(`<h3>${esc(nm(p))}</h3><p class="sub">Stock ${p.stock}, mínimo ${p.minimo}. Costo ${money(p.costo)}, venta ${money(p.venta)}.</p><div class="grid2"><button onclick="quick(${id},-1)">−1 Vender</button><button onclick="quick(${id},1)">＋1 Sumar</button><button onclick="mover(${id})">⇅ Mover stock</button><button onclick="formProd(${id})">✎ Editar</button></div><button class="dng" onclick="ask('¿Eliminar ${esc(nm(p)).replace(/'/g,'’')}? El historial de movimientos se conserva.','del(${id})')">Eliminar</button><button class="ghost" onclick="closeSheet()">Cerrar</button>`)}
function quick(id,d){const p=S.p.find(x=>x.id===id);if(p.stock+d<0){toast('No hay stock');return}
 p.stock+=d;log(p,d<0?'SALIDA':'ENTRADA',1,d<0?'Venta':'Compra');save();render();prod(id)}
function del(id){S.p=S.p.filter(x=>x.id!==id);save();render();toast('Producto eliminado')}
function mover(id){const p=S.p.find(x=>x.id===id);
 sheet(`<h3>Mover stock</h3><p class="sub">${esc(nm(p))}, stock actual ${p.stock}</p><label>Tipo<select id="mt"><option>ENTRADA</option><option>SALIDA</option><option>AJUSTE</option></select></label><label>Cantidad (en AJUSTE es el stock final)<input id="mc" type="number" inputmode="numeric" min="0" value="1"></label><label>Motivo<input id="mm" placeholder="Compra, daño, conteo…"></label><button onclick="doMover(${id})">Registrar</button><button class="ghost" onclick="closeSheet()">Cancelar</button>`)}
function doMover(id){const p=S.p.find(x=>x.id===id),t=$('#mt').value,c=parseInt($('#mc').value);
 if(isNaN(c)||c<0||(t!=='AJUSTE'&&c<1)){toast('Cantidad no válida');return}
 const d=t==='ENTRADA'?c:t==='SALIDA'?-c:c-p.stock;
 if(p.stock+d<0){toast('No hay suficiente stock');return}
 p.stock+=d;log(p,t,c,$('#mm').value||t);save();closeSheet();render();toast('Movimiento registrado')}
function formProd(id){
 const p=id?S.p.find(x=>x.id===id):{nombre:'',categoria:'Cascos',marca:'',talla:'',color:'',costo:'',venta:'',stock:0,minimo:2,ubicacion:''};
 const f=(k,l,t='text')=>`<label>${l}<input id="f_${k}" type="${t}" ${t==='number'?'inputmode="numeric" min="0"':''} value="${esc(p[k])}"></label>`;
 sheet(`<h3>${id?'Editar producto':'Nuevo producto'}</h3>${f('nombre','Nombre')}<label>Categoría<select id="f_categoria">${CATS.map(c=>`<option ${c===p.categoria?'selected':''}>${c}</option>`).join('')}</select></label><div class="grid2">${f('marca','Marca')}${f('talla','Talla')}${f('color','Color o diseño')}${f('ubicacion','Ubicación')}${f('costo','Precio costo','number')}${f('venta','Precio venta','number')}${f('stock',id?'Stock':'Stock inicial','number')}${f('minimo','Stock mínimo','number')}</div><button onclick="saveProd(${id||0})">Guardar</button><button class="ghost" onclick="closeSheet()">Cancelar</button>`)}
function saveProd(id){
 const g=k=>$('#f_'+k).value.trim(),n=k=>Math.max(0,parseFloat(g(k))||0);
 if(!g('nombre')){toast('Escribe el nombre del producto');return}
 const o={nombre:g('nombre'),categoria:g('categoria'),marca:g('marca'),talla:g('talla'),color:g('color'),ubicacion:g('ubicacion'),costo:n('costo'),venta:n('venta'),stock:Math.round(n('stock')),minimo:Math.round(n('minimo'))};
 if(id){const p=S.p.find(x=>x.id===id),d=o.stock-p.stock;Object.assign(p,o);if(d)log(p,'AJUSTE',o.stock,'Edición')}
 else{o.id=S.n.p++;S.p.push(o);if(o.stock>0)log(o,'ENTRADA',o.stock,'Stock inicial')}
 save();closeSheet();render();toast('Producto guardado')}
/* Venta */
function venta(){return `<input placeholder="Buscar producto para vender…" value="${esc(qv)}" oninput="qv=this.value;$('#vlist').innerHTML=vList()"><div id="vlist" class="vl">${vList()}</div><h3>Carrito</h3><div id="cart">${cartH()}</div><div class="grid2"><input placeholder="Cliente (opcional)" value="${esc(cl.n)}" oninput="cl.n=this.value"><input placeholder="Cédula o NIT" value="${esc(cl.d)}" oninput="cl.d=this.value"></div><input placeholder="Teléfono" inputmode="tel" value="${esc(cl.t)}" oninput="cl.t=this.value">${S.c.iva>0?`<label class="chk"><input type="checkbox" ${cl.iva?'checked':''} onchange="cl.iva=this.checked;$('#cart').innerHTML=cartH()">Sumar IVA (${S.c.iva}%)</label>`:''}<button onclick="facturar()">🧾 Generar factura</button>`}
function vList(){const k=qv.toLowerCase(),l=S.p.filter(p=>p.stock>0&&(!k||(p.nombre+' '+p.marca+' '+p.color).toLowerCase().includes(k)));
 return l.length?l.map(p=>`<div class="it" onclick="addCart(${p.id})"><span>${esc(nm(p))}<br><small class="sub">Stock ${p.stock}</small></span><b>${money(p.venta)}</b></div>`).join(''):'<p class="sub">No hay productos con stock para vender.</p>'}
const totals=()=>{const sub=cart.reduce((a,i)=>a+i.cant*i.precio,0),iva=cl.iva?Math.round(sub*S.c.iva/100):0;return{sub,iva,total:sub+iva}};
function cartH(){if(!cart.length)return '<p class="sub">Toca un producto de la lista para agregarlo.</p>';const t=totals();
 return cart.map(i=>`<div class="it"><span>${esc(i.desc)}<br><small class="sub">${money(i.precio)} c/u</small></span><button onclick="chg(${i.pid},-1)">−</button><b>${i.cant}</b><button onclick="chg(${i.pid},1)">＋</button></div>`).join('')+`<div class="tot">Subtotal ${money(t.sub)}${t.iva?'<br>IVA '+money(t.iva):''}<br><b>Total ${money(t.total)}</b></div>`}
function addCart(id){const p=S.p.find(x=>x.id===id),i=cart.find(x=>x.pid===id);
 if((i?i.cant:0)+1>p.stock){toast('No hay más unidades en stock');return}
 i?i.cant++:cart.push({pid:id,desc:nm(p),cant:1,precio:p.venta});$('#cart').innerHTML=cartH()}
function chg(pid,d){const i=cart.find(x=>x.pid===pid),p=S.p.find(x=>x.id===pid);
 if(d>0&&i.cant+1>p.stock){toast('No hay más unidades en stock');return}
 i.cant+=d;if(i.cant<1)cart=cart.filter(x=>x!==i);$('#cart').innerHTML=cartH()}
function facturar(){
 if(!cart.length){toast('El carrito está vacío');return}
 const t=totals(),num=S.c.pre+'-'+String(S.n.v).padStart(6,'0');
 const v={id:S.n.v++,num,fecha:now(),cliente:cl.n.trim()||'Consumidor final',doc:cl.d.trim(),tel:cl.t.trim(),items:cart.map(i=>({...i})),sub:t.sub,ivaPct:cl.iva?S.c.iva:0,iva:t.iva,total:t.total};
 cart.forEach(i=>{const p=S.p.find(x=>x.id===i.pid);p.stock-=i.cant;log(p,'SALIDA',i.cant,'Venta '+num)});
 S.v.unshift(v);save();cart=[];cl={n:'',d:'',t:'',iva:false};render();factura(v.id)}
function factura(id){const v=S.v.find(x=>x.id===id),c=S.c;
 sheet(`<div class="inv"><div class="ih"><div><h2>${esc(c.nombre)}</h2>${c.nit?'NIT '+esc(c.nit)+'<br>':''}${c.dir?esc(c.dir)+'<br>':''}${c.tel?'Tel: '+esc(c.tel):''}</div><div class="rt"><b>FACTURA DE VENTA</b><br>N.º <b>${esc(v.num)}</b><br>${v.fecha}</div></div><p><b>Cliente:</b> ${esc(v.cliente)}${v.doc?'<br><b>Documento:</b> '+esc(v.doc):''}${v.tel?'<br><b>Teléfono:</b> '+esc(v.tel):''}</p><table><tr><th>Descripción</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Total</th></tr>${v.items.map(i=>`<tr><td>${esc(i.desc)}</td><td class="r">${i.cant}</td><td class="r">${money(i.precio)}</td><td class="r">${money(i.cant*i.precio)}</td></tr>`).join('')}</table><div class="r">Subtotal ${money(v.sub)}${v.iva?'<br>IVA ('+v.ivaPct+'%) '+money(v.iva):''}<br><b style="font-size:17px">TOTAL ${money(v.total)}</b></div><p>Gracias por su compra.</p><p class="sm">Documento comercial generado por el sistema interno del negocio. No sustituye la factura electrónica de venta validada por la DIAN.</p></div><div class="noprint" style="margin-top:10px"><button onclick="window.print()">Imprimir o guardar PDF</button><button class="ghost" onclick="closeSheet()">Cerrar</button></div>`)}
/* Historial */
function hist(){
 const seg=`<div class="seg"><button class="${hv==='mov'?'on':''}" onclick="hv='mov';render()">Movimientos</button><button class="${hv==='ven'?'on':''}" onclick="hv='ven';render()">Ventas realizadas</button></div>`;
 if(hv==='ven')return seg+(S.v.length?S.v.map(v=>`<div class="card" onclick="factura(${v.id})"><div class="r1"><b>${esc(v.num)}</b><b>${money(v.total)}</b></div><div class="sub">${v.fecha}, ${esc(v.cliente)}</div></div>`).join('')+`<p class="sub">${S.v.length} ventas, total vendido ${money(S.v.reduce((a,v)=>a+v.total,0))}. Toca una para abrir la factura.</p>`:'<p class="sub">Todavía no hay ventas registradas.</p>');
 return seg+(S.m.length?S.m.slice(0,200).map(m=>`<div class="card"><div class="r1"><b>${esc(m.n)}</b><b class="${m.t==='SALIDA'?'out':'in'}">${m.t==='SALIDA'?'−':m.t==='ENTRADA'?'＋':'='}${m.c}</b></div><div class="sub">${m.f}, ${m.t.toLowerCase()}, ${esc(m.mo)}</div></div>`).join(''):'<p class="sub">Todavía no hay movimientos.</p>')}
/* Más */
function mas(){const c=S.c,f=(k,l,t='text')=>`<label>${l}<input id="c_${k}" type="${t}" value="${esc(c[k])}"></label>`;
 return `<h3>Datos del negocio</h3><p class="sub">Aparecen en la factura.</p>${f('nombre','Nombre del negocio')}${f('nit','NIT o cédula')}${f('dir','Dirección')}${f('tel','Teléfono')}<div class="grid2">${f('pre','Prefijo de factura')}${f('iva','IVA (%), 0 si no cobras IVA','number')}</div><button onclick="saveCfg()">Guardar datos</button>
 <h3>Copia de seguridad</h3><p class="sub">Los datos se guardan solo en este teléfono. Haz una copia con frecuencia y guárdala fuera del navegador.</p><div class="grid2"><button onclick="backup()">Hacer copia</button><button class="ghost" onclick="restoreUI()">Restaurar copia</button></div>
 <h3>Datos de prueba</h3><button class="ghost" onclick="ask('Esto reemplaza todo el inventario, los movimientos y las ventas actuales. ¿Continuar?','loadSeed()')">Cargar datos de prueba</button>`}
function saveCfg(){const g=k=>$('#c_'+k).value.trim();S.c={nombre:g('nombre')||'Motoaccesorios MIJ',nit:g('nit'),dir:g('dir'),tel:g('tel'),pre:g('pre')||'MIJ',iva:Math.max(0,parseFloat(g('iva'))||0)};save();toast('Datos guardados')}
function backup(){sheet(`<h3>Copia de seguridad</h3><p class="sub">Copia este texto y guárdalo (en una nota, un chat contigo mismo o un correo). Sirve para restaurar el inventario.</p><textarea id="bk" rows="7" readonly>${esc(JSON.stringify(S))}</textarea><button onclick="copyB()">Copiar</button><button class="ghost" onclick="dlB()">Descargar archivo</button><button class="ghost" onclick="closeSheet()">Cerrar</button>`)}
function copyB(){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Copiado')}
function dlB(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='copia-inventario-'+now().slice(0,10)+'.json';a.click()}catch(e){toast('Usa Copiar')}}
function restoreUI(){sheet(`<h3>Restaurar copia</h3><p class="sub">Pega el texto de tu copia o elige el archivo. Reemplaza todo lo que hay ahora.</p><textarea id="rb" rows="6" placeholder="Pega aquí la copia"></textarea><input type="file" accept=".json,application/json" onchange="readF(this)"><button onclick="doRestore()">Restaurar</button><button class="ghost" onclick="closeSheet()">Cancelar</button>`)}
function readF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rb').value=r.result};r.readAsText(f)}
function doRestore(){try{const o=JSON.parse($('#rb').value);if(!Array.isArray(o.p)||!Array.isArray(o.m))throw 0;S=Object.assign(blank(),o);save();closeSheet();render();toast('Copia restaurada')}catch(e){toast('La copia no es válida')}}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
